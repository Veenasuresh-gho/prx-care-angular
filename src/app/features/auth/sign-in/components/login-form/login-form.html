<div
  class="mx-auto w-full max-w-md overflow-hidden rounded-2xl bg-white shadow-[0_20px_60px_-15px_rgba(45,70,128,0.25)] ring-1 ring-black/5">
  <div class="h-1.5 w-full bg-gradient-to-r from-[#2D4680] to-[#4A67A3]"></div>
  <div class="p-8">
    <!-- Header -->
    <div class="space-y-1.5 pb-6">
      <h1 class="font-serif text-3xl font-semibold tracking-tight text-[#1F3159]">
        Hey, welcome back
      </h1>
      <p class="text-sm leading-relaxed text-grey">
        Sign in to pick up your care journey where you left off.
      </p>

    </div>
    <!-- Pulse Divider -->
    <div class="flex items-center gap-3 py-1" aria-hidden="true">
      <span class="h-px flex-1 bg-border"></span>
      <svg width="72" height="16" viewBox="0 0 72 16" fill="none">
        <path d="M0 8H20L24 2L30 14L34 8H72" stroke="#2D4680" stroke-width="1.6" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
      <span class="h-px flex-1 bg-border"></span>
    </div>
    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 space-y-5">
      <!-- Phone -->
      <app-input id="phone" name="phone" label="Phone number" type="tel" placeholder="Enter your phone number"
        formControlName="phone" [required]="true" [error]="
          form.controls.phone.touched &&
          form.controls.phone.invalid
            ? 'Phone number is required'
            : ''
        " />
      <!-- Password -->
      @if (!useOtp) {
      <app-input id="password" name="password" label="Password" type="password" placeholder="Enter your password"
        formControlName="password" [required]="true" [error]="
            form.controls.password.touched &&
            form.controls.password.invalid
              ? 'Password is required'
              : ''
          " />
      }
      <!-- Password / OTP -->
      <div class="grid grid-cols-2 gap-1 rounded-lg bg-slate-100 p-1 mt-2">
        <button type="button" (click)="setLoginMode(false)" class="rounded-md py-2 text-sm font-medium transition-all"
          [class.bg-white]="!useOtp" [class.text-[#1F3159]]="!useOtp" [class.shadow-sm]="!useOtp"
          [class.text-grey]="useOtp">
          Password
        </button>
        <button type="button" (click)="setLoginMode(true)" class="rounded-md py-2 text-sm font-medium transition-all"
          [class.bg-white]="useOtp" [class.text-[#1F3159]]="useOtp" [class.shadow-sm]="useOtp"
          [class.text-grey]="!useOtp">
          OTP
        </button>
      </div>
      <!-- Submit -->
      <app-button type="submit" variant="primary" [disabled]="isLoading" [fullWidth]="true">
        @if (isLoading) {
        @if (useOtp) {
        Sending OTP...
        } @else {
        Signing in...
        }
        } @else {
        @if (useOtp) {
        Send OTP
        } @else {
        Sign in
        }
        }
      </app-button>
    </form>

    <!-- Sign Up -->
    <p class="mt-6 text-center text-sm text-grey">
      Don't have an account?
      <button type="button" (click)="goToSignup()" class="ml-1 font-medium text-primary hover:underline">
        Sign up
      </button>
    </p>
  </div>
</div>
