<div class="fixed inset-0 grid w-screen grid-cols-1 bg-gradient-to-b from-[#F7F8FC] to-[#EEF1F8] lg:grid-cols-2">
    <div class="absolute left-5 top-5 z-50 sm:left-8 sm:top-6 lg:left-12 xl:left-20">
        <a routerLink="/">
            <img src="/assets/logo.svg" alt="PRx Care" class="h-10 w-auto cursor-pointer sm:h-12" />
        </a>
    </div>
    <section
        class="flex min-w-0 items-center justify-center overflow-y-auto px-4 pb-10 pt-24 sm:px-6 sm:pb-12 lg:px-8 lg:py-16 xl:px-12">
        <div
            class="w-full max-w-[460px] overflow-hidden rounded-2xl bg-white shadow-[0_20px_60px_-15px_rgba(45,70,128,0.25)] ring-1 ring-black/5">

            <div class="h-1.5 w-full bg-gradient-to-r from-[#2D4680] to-[#4A67A3]"></div>

            <div class="flex flex-col gap-6 p-6 sm:p-8 lg:p-9 xl:p-10">

                <div class="flex flex-col gap-2">

                    <h1 class="text-2xl font-semibold leading-tight tracking-tight text-[#1F3159] sm:text-3xl">
                        Enter verification code
                    </h1>

                    <p class="max-w-sm text-sm leading-relaxed text-gray-500 sm:text-base">
                        Enter the verification code sent to your phone.
                    </p>

                </div>

                <div class="flex items-center gap-3 py-1" aria-hidden="true">

                    <span class="h-px flex-1 bg-gray-200"></span>

                    <svg class="h-4 w-[72px] shrink-0" viewBox="0 0 72 16" fill="none">
                        <path d="M0 8H20L24 2L30 14L34 8H72" stroke="#2D4680" stroke-width="1.6" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>

                    <span class="h-px flex-1 bg-gray-200"></span>

                </div>

                <div class="flex flex-col items-center gap-6">

                    <div class="flex w-full justify-center gap-2 sm:gap-3">

                        @for (digit of [0, 1, 2, 3, 4, 5]; track digit) {

                        <mat-form-field appearance="outline" class="w-11 sm:w-12">

                            <input matInput [id]="'otp-' + digit" type="text" maxlength="1" inputmode="numeric"
                                autocomplete="one-time-code" [value]="otp[digit]" (input)="onOtpInput($event, digit)"
                                (keydown)="onOtpKeyDown($event, digit)"
                                class="text-center text-lg font-semibold text-[#1F3159]" />

                        </mat-form-field>

                        }

                    </div>

                    <div class="flex items-center gap-1.5 text-sm text-gray-500">

                        <span>Didn't get the code?</span>

                        <button type="button" (click)="resendOtp()" [disabled]="resendLoading"
                            class="h-auto px-0 font-medium text-[#2D4680] hover:underline disabled:cursor-not-allowed disabled:opacity-50">

                            @if (resendLoading) {
                            Sending...
                            } @else {
                            Resend
                            }

                        </button>

                    </div>

                    <app-button type="button" variant="primary" [disabled]="loading" [fullWidth]="true"
                        (click)="verifyOtp()">
                        @if (loading) {
                        Verifying...
                        } @else {
                        Verify & continue
                        }
                    </app-button>

                </div>

            </div>

        </div>

    </section>

    <section class="relative hidden min-w-0 overflow-hidden lg:block">

        <img src="/signin.png" alt="PRx Care healthcare platform"
            class="absolute inset-0 h-full w-full object-cover object-center" />

        <div class="absolute inset-0 bg-gradient-to-t from-[#1F3159]/95 via-[#2D4680]/35 to-transparent"></div>

        <div class="absolute inset-x-0 bottom-0 z-10 p-8 sm:p-10 xl:p-14 2xl:p-16">

            <div class="max-w-xl">

                <div
                    class="mb-5 inline-flex items-center gap-2 rounded-full bg-white/95 px-4 py-2.5 shadow-lg backdrop-blur">

                    <img src="/assets/logo.svg" alt="PRx Logo" class="h-7 w-7" />

                    <p class="text-lg font-bold text-[#1F3159]">
                        PRx.Care
                    </p>

                </div>

                <p class="mb-2 text-xs font-medium uppercase tracking-[0.2em] text-[#A9BBE0] sm:text-sm">
                    Trusted care, simplified
                </p>

                <h2 class="text-3xl leading-[1.05] text-white sm:text-3xl xl:text-4xl">

                    Your complete
                    healthcare
                    platform

                </h2>

                <svg class="mt-6 h-8 w-40" viewBox="0 0 160 32" fill="none" aria-hidden="true">

                    <path d="M0 16H40L48 4L58 28L66 16H160" stroke="#A9BBE0" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" stroke-dasharray="240" stroke-dashoffset="240" class="pulse-line" />

                </svg>

            </div>

        </div>

    </section>

</div>
