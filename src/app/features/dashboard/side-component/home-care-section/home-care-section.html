<div>
    <!-- Header -->
    <div class="mb-3 flex items-center justify-between bg-background">
        <div>
            <h1 class="font-bold">
                Home Care
            </h1>
            <p class="text-xs text-muted-foreground">
                Book trusted services at your doorstep
            </p>
        </div>
        <app-button variant="ghost" customClass="text-xs" (click)="handleShowBookings()">
            Show Bookings
        </app-button>
    </div>
    <!-- Home Care Cards -->
    <div class="grid grid-cols-2 gap-2">
        @for (item of homeCare; track item.heading) {
        <div class="
          cursor-pointer
          overflow-hidden
          rounded-lg
          border-none
          last:odd:col-span-2
        " [ngClass]="[item.bg, item.border]" (click)="item.onClick()">
            <!-- Card Content -->
            <div class="p-4">
                <h2 class="font-bold text-gray-700">
                    {{ item.heading }}
                </h2>
                <p class="text-xs text-gray-600">
                    {{ item.subHeading }}
                </p>
            </div>
            <!-- Card Image -->
            <div class="flex justify-center p-0">
                <img [src]="item.image" [alt]="item.heading" class="h-auto max-h-28 w-auto object-contain" />
            </div>
        </div>
        }
    </div>
</div>
<!-- General Physician Dialog -->
<app-general-physician-dialog [open]="showGeneralDialog"
    (openChange)="showGeneralDialog = $event" [countryList]="countryList"></app-general-physician-dialog>
<app-pharmacy-delivery [open]="showPharmacyDialog" (openChange)="showPharmacyDialog = $event"></app-pharmacy-delivery>
<app-nursing-services [open]="showNursingDialog" (openChange)="showNursingDialog = $event"></app-nursing-services>
<app-lab-collection-dialog [open]="showLabDialog" (openChange)="showLabDialog = $event"></app-lab-collection-dialog>
