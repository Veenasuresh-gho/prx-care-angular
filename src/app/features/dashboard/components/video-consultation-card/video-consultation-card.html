<div class="relative w-full overflow-hidden rounded-2xl border border-white/10 bg-cover bg-center px-6 py-10 font-sans sm:px-10 sm:py-10"
    style="
    background-image:
      linear-gradient(
        180deg,
        rgba(6, 20, 17, 0.90) 0%,
        rgba(6, 20, 17, 0.80) 45%,
        rgba(6, 20, 17, 0.96) 100%
      ),
      url('/assets/video.avif');
  ">
    <div class="relative mx-auto flex max-w-md flex-col items-center text-center">
        <!-- Call badge -->
        <div class="relative mb-6 flex items-center justify-center">
            <span class="absolute h-16 w-16 animate-pulse rounded-full bg-primary/15"></span>
            <div
                class="relative flex h-14 w-14 items-center justify-center rounded-full border border-white/10 bg-white/5 shadow-[0_0_0_1px_rgba(255,255,255,0.03)] backdrop-blur-sm">
                <mat-icon class="!flex !h-5 !w-5 !items-center !justify-center !text-primary">
                    videocam
                </mat-icon>
            </div>
        </div>
        <!-- Status pill -->
        <div class="mb-5 flex items-center gap-1.5 rounded-full border border-white/10 bg-white/5 px-3 py-1">
            <span class="relative flex h-1.5 w-1.5">
                <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-green opacity-75"></span>

                <span class="relative inline-flex h-1.5 w-1.5 rounded-full bg-green"></span>
            </span>

            <span class="text-xs font-medium tracking-wide text-white/70">
                Doctors online now
            </span>
        </div>

        <!-- Heading -->
        <h3 class="font-semibold text-white sm:text-lg">
            Talk to a doctor by video, in the next few minutes
        </h3>
        <!-- Description -->
        <p class="mt-3 text-sm  text-white/60">
            Private video call, no clinic visit. Prescriptions sent straight
            to your pharmacy.
        </p>
        <!-- Button -->
        <app-button customClass="mt-2" (click)="handleBook()">
            Book consultation
        </app-button>

    </div>
</div>
