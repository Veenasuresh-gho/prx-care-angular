<section class="p-0">
    <div class="w-full">
        <h2 class="py-4 text-lg font-semibold">
            Featured Services
        </h2>
        <div class="grid grid-cols-1 gap-4 md:gap-6 lg:grid-cols-3">
            @for (feature of features; track feature.title) {
            <div class="group flex h-full flex-col justify-between overflow-hidden rounded-2xl border-none p-6 shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-lg"
                [style.background-color]="feature.bgColor">
                <div class="flex flex-col gap-3">
                    <div class="flex items-center justify-between">

                        <span
                            class="flex h-9 w-9 items-center justify-center rounded-full transition-transform duration-300 group-hover:scale-110"
                            [style.background-color]="feature.accentColor">
                            <mat-icon class="text-white transition-transform duration-300 group-hover:rotate-45">
                                arrow_upward
                            </mat-icon>
                        </span>
                    </div>
                    <h3 class="text-lg font-bold leading-snug" [style.color]="feature.accentColor">
                        {{ feature.title }}
                    </h3>
                    <p class="text-sm leading-relaxed" [style.color]="feature.textColor">
                        {{ feature.description }}
                    </p>
                </div>
                <div class="flex justify-center py-6">
                    <img [src]="feature.image" [alt]="feature.title"
                        class="h-auto w-28 object-contain transition-transform duration-300 group-hover:scale-105 md:w-32" />
                </div>
                <button type="button"
                    class="w-full rounded-md bg-[#2D4680] px-4 py-2.5 text-sm font-medium text-white transition-colors hover:bg-[#233968] cursor-pointer"
                    (click)="explore(feature.link)">
                    Explore
                </button>
            </div>
            }
        </div>
    </div>
</section>
