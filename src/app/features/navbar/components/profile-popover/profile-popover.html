<div class="relative">

  <!-- Profile Button -->
  <button
    type="button"
    class="cursor-pointer rounded-full ring-offset-2 ring-offset-white transition-shadow duration-150 hover:ring-2 hover:ring-primary/30 focus:outline-none focus:ring-2 focus:ring-primary/50"
    aria-label="Open profile menu"
    (click)="togglePopover()"
  >

    @if (patient()?.imageUrl) {

      <img
        [src]="patient()?.imageUrl"
        [alt]="fullName"
        class="h-10 w-10 rounded-full object-cover"
      />

    } @else {

      <div
        class="flex h-10 w-10 items-center justify-center rounded-full bg-primary/10"
      >

        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6 text-primary"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"
          />
        </svg>

      </div>

    }

  </button>


  @if (isOpen()) {

    <!-- Overlay -->
    <div
      class="fixed inset-0 z-40"
      (click)="closePopover()"
    ></div>


    <!-- Popover -->
    <div
      class="absolute right-0 z-50 mt-3 w-64 overflow-hidden rounded-xl border border-border bg-white shadow-lg"
    >

      <!-- Identity Header -->
      <div
        class="flex flex-col items-center gap-2.5 bg-primary/5 px-5 pb-5 pt-6"
      >

        @if (patient()?.imageUrl) {

          <img
            [src]="patient()?.imageUrl"
            [alt]="fullName"
            class="h-16 w-16 rounded-full object-cover shadow-sm ring-2 ring-white"
          />

        } @else {

          <div
            class="flex h-16 w-16 items-center justify-center rounded-full bg-primary/10 ring-2 ring-white shadow-sm"
          >

            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-10 w-10 text-primary"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"
              />
            </svg>

          </div>

        }

        <div class="text-center">

          <p class="text-sm font-semibold leading-tight text-black">
            {{ fullName || 'Patient' }}
          </p>

          @if (patient()?.patientId) {

            <p class="mt-0.5 text-xs text-grey">
              Patient ID: {{ patient()?.patientId }}
            </p>

          }

        </div>

      </div>


      <!-- Actions -->
      <div class="flex flex-col gap-1 p-2">

        <!-- Profile -->
        <button
          type="button"
          class="flex h-10 w-full items-center justify-between gap-2 rounded-md px-3 font-normal transition-colors hover:bg-slate-100"
          (click)="viewProfile()"
        >

          <span class="flex items-center gap-2">

            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-4 w-4 text-grey"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"
              />
            </svg>

            View profile

          </span>


          <!-- Chevron -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4 text-grey"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 5l7 7-7 7"
            />
          </svg>

        </button>


        <div class="mx-1 my-1 h-px bg-border"></div>


        <!-- Logout -->
        <button
          type="button"
          class="flex h-10 w-full items-center justify-start gap-2 rounded-md px-3 font-normal text-red transition-colors hover:bg-red-light"
          (click)="logout()"
        >

          <!-- Logout Icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6A2.25 2.25 0 005.25 5.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15"
            />

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M18 15l3-3m0 0l-3-3m3 3H9"
            />
          </svg>

          Logout

        </button>

      </div>

    </div>

  }

</div>
