<nav class="sticky top-0 z-50 w-full border-b border-gray-100 bg-white">
    <div class="mx-auto flex h-16 md:h-20 max-w-7xl items-center justify-between px-4 sm:px-6">
        <div class="flex min-w-0 shrink-0 items-center gap-3">
            <div class="nav-logo shrink-0">
                <app-logo></app-logo>
            </div>
            <div class="hidden md:flex items-center">
                <app-services-dropdown></app-services-dropdown>
            </div>
        </div>
        <div class="flex shrink-0 items-center gap-3 sm:gap-4 md:gap-6">
            <div class="relative">
                <app-notification-popover></app-notification-popover>
            </div>
            @if (isAuthenticated()) {
            <div>
                <app-message-center></app-message-center>
            </div>
            }
            @if (isAuthenticated()) {
            <app-profile-popover
                [patientDetails]="patientDetails">
            </app-profile-popover>
            } @else {
            <button
                type="button"
                class="hidden sm:flex items-center gap-2 rounded-md bg-primary px-4 py-2 text-sm font-medium text-white hover:bg-primary-dark"
                (click)="signIn()">
                Sign In
            </button>
            }
            <button
                type="button"
                class="flex md:hidden h-10 w-10 shrink-0 items-center justify-center rounded-lg text-gray-700 hover:bg-gray-100"
                (click)="toggleMobileMenu()"
                [attr.aria-expanded]="isMobileMenuOpen"
                aria-label="Toggle navigation menu">

                <mat-icon>
                    {{ isMobileMenuOpen ? 'close' : 'menu' }}
                </mat-icon>
            </button>
        </div>
    </div>
    @if (isMobileMenuOpen) {
    <div class="mobile-navigation md:hidden border-t border-gray-100 bg-white px-4 py-4 shadow-lg">
        <div class="mobile-services-menu">
            <app-services-dropdown></app-services-dropdown>
        </div>
        @if (!isAuthenticated()) {
        <button
            type="button"
            class="mt-4 w-full rounded-lg bg-primary px-4 py-3 text-sm font-medium text-white"
            (click)="signIn(); toggleMobileMenu()">
            Sign In
        </button>
        }
    </div>
    }
</nav>
