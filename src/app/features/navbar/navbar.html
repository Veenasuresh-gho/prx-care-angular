<nav class="flex h-20 items-center justify-between">

  <div class="flex items-center gap-x-6">

    <div class="flex items-center">

      <app-logo />

    </div>

  </div>

  <div class="flex items-center gap-x-6">

    <div class="relative">
      <app-notification-popover />
    </div>

    @if (isAuthenticated()) {

      <app-profile-popover
        [patient]="patient"
      />

    } @else {

      <button
        type="button"
        class="flex items-center gap-2 rounded-md bg-primary px-4 py-2 text-sm font-medium text-white hover:bg-primary-dark"
        (click)="signIn()"
      >
        Sign In
      </button>

    }

  </div>

</nav>
