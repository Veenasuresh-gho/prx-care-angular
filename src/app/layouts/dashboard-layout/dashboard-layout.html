<div class="min-h-screen">
  <app-navbar />
  <!-- Welcome Card - Dashboard Only -->
  @if (isDashboard) {
  <div class="mx-auto w-full max-w-7xl px-4 sm:px-6">
    <app-welcome-card [patientDetails]="patientDetails" />
  </div>
  }
  <!-- Main Layout -->
  <div class="mx-auto flex w-full max-w-7xl flex-col gap-4 px-4 sm:px-6 lg:flex-row">
    <!-- Main Content -->
    <main class="order-1 min-w-0 flex-1 lg:order-1">
      <router-outlet [routerOutletData]="{
          patientDetails: patientDetails,
          advertisements: advertisements
        }" />
    </main>
    <!-- Side Component -->
    <aside class="order-2 w-full shrink-0 lg:w-[320px] xl:w-[360px]" [class.hidden]="!isDashboard"
      [class.lg:block]="true">
      <app-side-component [appointmentDetails]="appointmentDetails" [isLoading]="isLoading" />
    </aside>
  </div>
  <!-- Footer -->
  <app-footer />
</div>
