@if (open) {
<div
    class="fixed inset-0 z-50 bg-black/40"
    (click)="close()">
</div>
<div
    [ngClass]="[sheetClasses, 'sheet-' + side]"
    [style.width]="side === 'left' || side === 'right' ? 'min(' + width + ', 100vw)' : null"
    [style.maxWidth]="side === 'left' || side === 'right' ? '100vw' : null">
    <div class="sticky top-0 z-10 flex items-start justify-between gap-3 border-b border-gray-200 bg-white px-4 sm:px-5 py-4 shadow-sm">
        <div class="min-w-0 flex-1">
            @if (title) {
            <h2 class="text-base sm:text-lg font-semibold text-gray-900">
                {{ title }}
            </h2>
            }

            @if (description) {
            <p class="mt-1 text-xs sm:text-sm text-gray-500">
                {{ description }}
            </p>
            }
        </div>

        @if (showClose) {
        <button
            type="button"
            class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md text-gray-500 hover:bg-gray-100 hover:text-gray-900"
            (click)="close()">
            <span class="text-xl leading-none">&times;</span>
        </button>
        }
    </div>
    <div class="flex-1 min-h-0 overflow-y-auto bg-white p-4 sm:p-5">
        <ng-content></ng-content>
    </div>
    <div class="sticky bottom-0 z-10 border-t border-gray-200 bg-white px-4 sm:px-5 shadow-inner">
        <ng-content select="[sheet-footer]"></ng-content>
    </div>

</div>
}
