<div class="w-full">
    <!-- Month Header -->
    <div class="mb-4 flex items-center justify-between">
        <!-- Previous Month -->
        <button type="button" (click)="handleMonthLeft()" [disabled]="isAtEarliest" aria-label="Previous month"
            class="flex h-9 w-9 items-center justify-center rounded-full text-slate-500 transition hover:bg-slate-100 hover:text-slate-900 disabled:cursor-not-allowed disabled:opacity-30">
            <mat-icon class="!text-xl">
                chevron_left
            </mat-icon>
        </button>
        <!-- Month -->
        <span class="text-[15px] font-semibold text-slate-900">
            {{ currentLabel }}
        </span>
        <!-- Next Month -->
        <button type="button" (click)="handleMonthRight()" aria-label="Next month"
            class="flex h-9 w-9 items-center justify-center rounded-full text-slate-500 transition hover:bg-slate-100 hover:text-slate-900">
            <mat-icon class="!text-xl">
                chevron_right
            </mat-icon>
        </button>
    </div>
    <!-- Date Scroll -->
    <div class="flex items-center justify-center gap-1.5 py-2 sm:gap-2">
        <!-- Previous Dates -->
        <button type="button" (click)="handlePageLeft()" [disabled]="isAtEarliest" aria-label="Previous dates"
            class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-primary/10 text-primary transition hover:bg-primary/15 disabled:cursor-not-allowed disabled:bg-primary/10 disabled:opacity-30 sm:h-8 sm:w-8">
            <mat-icon class="!text-base">
                chevron_left
            </mat-icon>
        </button>
        <!-- Dates -->
        @for (date of visibleDates; track date.toISOString()) {
        <button type="button" (click)="handleDateClick(date)"
            class="relative flex h-12 w-11 shrink-0 flex-col items-center justify-center gap-0.5 rounded-xl border transition sm:h-20 sm:w-20"
            [class.bg-primary]="isSelected(date)" [class.!text-white]="isSelected(date)"
            [class.border-primary]="isSelected(date)" [class.border-slate-200]="!isSelected(date)"
            [class.text-slate-700]="!isSelected(date)" [class.hover:border-primary/40]="!isSelected(date)"
            [class.hover:bg-primary/5]="!isSelected(date)">
            <!-- Date -->
            <p class="text-[13px] font-semibold leading-none sm:text-xl">
                {{ formatDay(date) }}
            </p>
            <!-- Week Day -->
            <p class="text-[10px] leading-none opacity-80 sm:text-[13px]">
                {{ formatWeekDay(date) }}
            </p>
            <!-- Today Indicator -->
            @if (isToday(date) && !isSelected(date)) {
            <span class="absolute bottom-1 h-1 w-1 rounded-full bg-primary"></span>
            }
        </button>
        }
        <!-- Next Dates -->
        <button type="button" (click)="handlePageRight()" aria-label="Next dates"
            class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-primary/10 text-primary transition hover:bg-primary/15 sm:h-8 sm:w-8">
            <mat-icon class="!text-base">
                chevron_right
            </mat-icon>
        </button>
    </div>
</div>
