<div class="bg-primary/10 border-0 rounded-xl overflow-hidden mt-4">
    <div class="flex flex-col md:flex-row items-center gap-6 p-6">

    
        <div class="w-full md:w-1/4">
            <img [src]="banner" alt="Medication Banner" class="rounded-xl w-full h-auto object-cover" />
        </div>

        <div class="w-full md:w-1/2 space-y-2 text-center md:text-left">
            <p class="text-muted-foreground">
                Stay Organized and never miss a dose. Easily track your medications
                for quick access anytime, whether for a refill or an emergency.
            </p>

            <p class="text-lg font-bold">
                Smart Tracking for Everyday Care.
            </p>
        </div>


    </div>
</div>
