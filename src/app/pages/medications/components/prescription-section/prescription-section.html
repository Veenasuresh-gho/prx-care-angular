<div class="prescription-section">

    @if (loading) {

    <div class="flex justify-center py-10">
        <mat-spinner diameter="40"></mat-spinner>
    </div>

    } @else if (prescriptions.length === 0) {

    <app-empty-message message="No prescriptions available." />

    } @else {

    <div class="grid grid-cols-1 gap-4">

        @for (prescription of prescriptions; track prescription.ID) {

        <div class="prescription-card cursor-pointer" (click)="openPrescription(prescription)">

            <!-- Top section -->
            <div class="flex items-start justify-between gap-4">

                <div class="space-y-1">

                    <p class="text-lg font-bold text-gray-900">
                        {{ prescription.Doctor }}
                    </p>

                    <p class="text-sm font-medium text-primary">
                        {{ prescription.Specialty }}
                    </p>

                    <p class="text-sm text-gray-700">
                        {{ prescription.TenantName }}
                    </p>

                </div>

                <!-- Appointment ID -->
                <div>
                    <span class="appointment-badge">
                        {{ prescription.AppointmentID }}
                    </span>
                </div>

            </div>

            <!-- Appointment time -->
            <div class="mt-3 flex justify-end">
                <span class="text-xs text-gray-500">
                    {{ prescription.AppointmentTime }}
                </span>
            </div>

        </div>

        }

    </div>

    }

</div>
