<form [formGroup]="medicationForm" (ngSubmit)="submit()" class="flex flex-col h-full">

    <div class="flex-1 space-y-6 overflow-y-auto">

        <!-- Medication Name -->
        <div>

            <label class="block text-sm font-medium text-gray-700 mb-2">
                Medication Name
            </label>

            <input type="text" formControlName="medicationName" placeholder="Enter medication name" class="w-full rounded-lg border border-gray-300
                       px-3 py-2.5 text-sm
                       outline-none
                       focus:border-primary
                       focus:ring-1 focus:ring-primary" />

            @if (
            medicationForm.controls.medicationName.touched &&
            medicationForm.controls.medicationName.invalid
            ) {

            <p class="mt-1 text-xs text-red-500">
                Medication name is required.
            </p>

            }

        </div>


        <!-- Start Date -->
        <div>

            <label class="block text-sm font-medium text-gray-700 mb-2">
                Start Date
            </label>

            <input type="date" formControlName="startDate" class="w-full rounded-lg border border-gray-300
                       px-3 py-2.5 text-sm
                       outline-none
                       focus:border-primary
                       focus:ring-1 focus:ring-primary" />

        </div>


        <!-- End Date -->
        <div>

            <label class="block text-sm font-medium text-gray-700 mb-2">
                End Date
            </label>

            <input type="date" formControlName="endDate" class="w-full rounded-lg border border-gray-300
                       px-3 py-2.5 text-sm
                       outline-none
                       focus:border-primary
                       focus:ring-1 focus:ring-primary" />

        </div>


        <!-- Frequency -->
        <div>

            <label class="block text-sm font-medium text-gray-700 mb-3">
                Frequency
            </label>

            <div class="grid grid-cols-2 gap-3">

                @for (
                option of frequencyOptions;
                track option
                ) {

                <button type="button" (click)="toggleFrequency(option)" class="rounded-lg border px-4 py-3
                               text-sm font-medium
                               transition-all" [class.bg-primary]="
                            isFrequencySelected(option)
                        " [class.text-white]="
                            isFrequencySelected(option)
                        " [class.border-primary]="
                            isFrequencySelected(option)
                        " [class.bg-white]="
                            !isFrequencySelected(option)
                        " [class.text-gray-700]="
                            !isFrequencySelected(option)
                        " [class.border-gray-300]="
                            !isFrequencySelected(option)
                        ">
                    {{ option }}
                </button>

                }

            </div>

        </div>

    </div>


    <!-- Footer -->
    <div class="sticky bottom-0
               bg-white
               border-t border-gray-200
               pt-4 mt-6">

        <button type="submit" [disabled]="isLoading" class="w-full rounded-lg
                   bg-primary text-white
                   px-4 py-3
                   text-sm font-medium
                   hover:opacity-90
                   disabled:opacity-50">

            @if (isLoading) {

            Updating...

            } @else {

            Update Medication

            }

        </button>
    </div>
</form>
