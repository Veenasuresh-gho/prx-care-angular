<div class="h-screen flex flex-col bg-[#f8fbf9] overflow-hidden rounded-md border border-blue-400 md:mt-3">
    <div class="bg-white py-4 px-4 shadow-sm">
        <div class="flex items-center gap-4 max-w-3xl mx-auto">
            <div class="w-12 h-12 rounded-lg overflow-hidden">
                <img src="assets/nutrition.png" alt="nutrition-bot" class="w-full h-full object-cover">
            </div>
            <div>
                <h1 class="text-2xl font-semibold text-[#2d4739]">
                    NutriCoach
                </h1>
                <p class="text-sm text-[#6b8575]">
                    Smarter food choices made simple.
                </p>
            </div>
        </div>
    </div>
    <div class="flex-1 max-w-3xl mx-auto w-full flex flex-col bg-[#e7fefe] p-6 overflow-hidden">
        <div #chatContainer class="flex-1 overflow-y-auto pr-2 no-scrollbar flex flex-col gap-4">
            @for (message of messages; track message.id) {
            <div class="flex items-start gap-2" [class.justify-end]="message.type === 'user'"
                [class.justify-start]="message.type === 'bot'">
                @if (message.type === 'bot') {
                <div class="w-8 h-8 rounded-full overflow-hidden shrink-0">
                    <img src="assets/nutrition.png" alt="bot" class="w-full h-full object-cover">
                </div>
                }
                <div class="max-w-[75%] p-4 rounded-2xl text-sm leading-6 whitespace-pre-line"
                    [class.bg-teal-500]="message.type === 'user'" [class.text-white]="message.type === 'user'"
                    [class.bg-white]="message.type === 'bot'" [class.text-[#3a4f44]]="message.type === 'bot'">
                    {{ message.text }}
                </div>
                @if (message.type === 'user') {
                <div
                    class="w-8 h-8 rounded-full bg-white flex items-center justify-center text-teal-600 font-bold shrink-0">
                    <mat-icon>
                        person
                    </mat-icon>
                </div>
                }
            </div>
            }
            @if (isTyping) {
            <div class="flex items-start gap-2">
                <div class="w-8 h-8 rounded-full overflow-hidden shrink-0">
                    <img src="assets/nutrition.png" alt="bot typing" class="w-full h-full object-cover">
                </div>
                <div class="bg-white px-4 py-3 rounded-2xl shadow-sm flex items-center gap-1">
                    <span class="block w-2.5 h-2.5 rounded-full bg-teal-500 animate-bounce">
                    </span>
                    <span class="block w-2.5 h-2.5 rounded-full bg-teal-500 animate-bounce"
                        style="animation-delay: 150ms">
                    </span>
                    <span class="block w-2.5 h-2.5 rounded-full bg-teal-500 animate-bounce"
                        style="animation-delay: 300ms">
                    </span>
                </div>
            </div>
            }
        </div>
        @if (messages.length === 1 && !isTyping) {
        <div class="flex flex-wrap gap-2 mt-4">
            @for (reply of quickReplies; track reply) {
            <button type="button" (click)="selectQuickReply(reply)"
                class="px-3 py-1 rounded-full text-sm text-[#4a6b5a] bg-white/80 hover:bg-white transition-colors cursor-pointer">
                {{ reply }}
            </button>
            }
        </div>
        }
        <div class="mt-4 flex items-end gap-2 bg-white rounded-3xl p-2">
            <textarea [(ngModel)]="inputValue" (keydown)="handleKeyDown($event)" placeholder="Type your message..."
                rows="1"
                class="flex-1 resize-none min-h-[24px] max-h-[100px] mb-2 ml-2 bg-transparent outline-none border-none text-sm text-[#3a4f44]">
            </textarea>
            <button type="button" (click)="sendMessage()" [disabled]="!inputValue.trim() || isTyping"
                class="w-10 h-10 rounded-lg flex items-center justify-center cursor-pointer"
                [class.bg-gradient-to-br]="inputValue.trim() && !isTyping"
                [class.from-teal-200]="inputValue.trim() && !isTyping"
                [class.to-teal-400]="inputValue.trim() && !isTyping" [class.text-white]="true"
                [class.bg-teal-200]="!inputValue.trim() || isTyping"
                [class.cursor-not-allowed]="!inputValue.trim() || isTyping">
                <mat-icon>
                    send
                </mat-icon>
            </button>
        </div>
    </div>
</div>
