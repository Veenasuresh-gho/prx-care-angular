            Back
        </button>
    </div>

            <h2 class="text-lg font-bold mb-4 py-2">

            </h2>

                    <app-start-chat-with-bot (startChat)="startChat()">

                </div>
                <div>
                    <app-talk-to-wellness-expert></app-talk-to-wellness-expert>
                </div>
                <div>
                    <app-lifestyle-plan></app-lifestyle-plan>

            <app-wellness-chat></app-wellness-chat>
