<div class="mt-2 w-full py-2">
    <div class="flex w-full gap-2">
        <!-- Search Input -->
        <div class="relative flex-1">
            <!-- Search Icon -->
            <mat-icon class="absolute left-3 top-1/2 -translate-y-1/2 text-primary">
                search
            </mat-icon>
            <input type="text" [(ngModel)]="searchTerm" (keydown)="handleKeyDown($event)" [placeholder]="placeholder"
                class="h-12 w-full rounded-full border-2 border-primary bg-card pl-10 pr-10 placeholder:font-semibold placeholder:text-primary focus:outline-none focus:ring-2 focus:ring-primary/20" />
            <!-- Clear Button -->
            @if (searchTerm) {
            <button type="button" (click)="handleClear()"
                class="absolute right-3 top-1/2 -translate-y-1/2 rounded-full p-1 text-muted-foreground transition-colors hover:bg-muted hover:text-foreground"
                aria-label="Clear search">
                <mat-icon class="block text-xs">close</mat-icon>
            </button>
            }
        </div>
        <!-- Search Button -->
        <app-button customClass="!rounded-full" [disabled]="!searchTerm.trim()" (click)="handleSearch()">
            <mat-icon>search</mat-icon>
        </app-button>
    </div>
</div>
