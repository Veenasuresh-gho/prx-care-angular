<div class="flex gap-4 rounded-xl border border-gray-100 bg-white p-5 shadow-sm">

        {{ icon }}
    </div>
    <div class="space-y-1">
        <h4 class="text-base font-semibold text-gray-900">
            {{ title }}

            {{ description }}
        </p>
    </div>
</div>
