<div class="vitals-history">
    @if (recentVitals.length > 0) {
    <div class="history-header">
        <p class="created-by">
            Created By :
            <span>
                {{ recentVitals[0].CreatedBy }} <span class="created-date">( {{ formatDate(recentVitals[0]?.CreatedAt)
                    }})</span>
            </span>
        </p>
    </div>
    <app-vital-card [recentVitals]="recentVitals[0]"></app-vital-card>
    }

</div>
