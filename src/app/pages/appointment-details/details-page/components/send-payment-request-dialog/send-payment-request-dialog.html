<app-dialog [open]="open" (openChange)="handleDialogChange($event)" size="md">
  <div class="w-full">
    <div class="mb-3 flex items-center justify-between">
      <h2 class="text-left text-xl font-bold text-slate-900">
        Send Payment Request
      </h2>

      <button type="button" (click)="handleDialogChange(false)" class="flex h-9 w-9 items-center justify-center rounded-full
           text-slate-500 transition hover:bg-slate-100 hover:text-slate-900" aria-label="Close dialog">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <p class="mt-1 mb-1 text-[14px] text-slate-500">
      Enter the details of the person you'd like to
      request payment from.
    </p>
    <p class="mb-6 text-[14px] text-slate-700">
      Amount to request:

      <span class="font-semibold text-slate-900">
        ₹{{ amount.toFixed(2) }}
      </span>
    </p>
    <form [formGroup]="form" class="space-y-4" (ngSubmit)="handleSend()">
      <input type="text" formControlName="fullName" placeholder="Full Name"
        class="h-14 w-full rounded-xl border border-slate-200 bg-white px-4 text-[15px] text-slate-900 outline-none placeholder:text-slate-400 focus:border-primary focus:ring-1 focus:ring-primary" />
      <div class="grid grid-cols-[minmax(0,0.32fr)_minmax(0,0.68fr)] gap-3">
        <app-country-select-field [selectedCountryCode]="form.controls.countryCode.value"
          (selectedCountryCodeChange)="form.controls.countryCode.setValue($event)"
          (countryIdChange)="form.controls.countryId.setValue($event)" placeholder="Country Code" />

        <!-- Phone -->
        <input type="tel" formControlName="phoneNumber" placeholder="Phone Number"
          class="h-14 w-full rounded-xl border border-slate-200 bg-white px-4 text-[15px] text-slate-900 outline-none placeholder:text-slate-400 focus:border-primary focus:ring-1 focus:ring-primary" />
      </div>
      <input type="email" formControlName="email" placeholder="Email"
        class="h-14 w-full rounded-xl border border-slate-200 bg-white px-4 text-[15px] text-slate-900 outline-none placeholder:text-slate-400 focus:border-primary focus:ring-1 focus:ring-primary" />
      <div class="mt-8 flex items-center justify-end gap-3">
        <button type="button" (click)="handleDialogChange(false)" class="h-12 rounded-xl border border-slate-200
           bg-white px-6 text-sm font-semibold text-slate-700
           transition hover:bg-slate-50">
          Cancel
        </button>

        <app-button [disabled]="!isValid || loading" type="submit">
          @if (loading) {
          <mat-icon class="animate-spin !text-[16px]">sync</mat-icon>
          Sending...
          } @else {
          Send Payment Request
          }
        </app-button>

      </div>

    </form>
  </div>
</app-dialog>
