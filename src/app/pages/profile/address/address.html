<div class="rounded-2xl border border-slate-200 bg-white shadow-sm">
    <!-- Header -->
    <div class="flex items-center justify-between px-5 pt-5 sm:px-6">
        <h2 class="text-base font-semibold text-slate-900">
            Address
        </h2>
        <button type="button" aria-label="Edit address" class="inline-flex items-center gap-1.5
             rounded-lg border border-slate-200
             bg-white px-4 py-2
             text-sm font-medium text-slate-700
             transition
             hover:bg-slate-50
             focus:outline-none
             focus:ring-2
             focus:ring-primary/30" [disabled]="loading" (click)="openEditDialog()">
            <span class="material-icons text-[18px]" aria-hidden="true">
                edit
            </span>
            <span>Edit</span>

        </button>
    </div>
    <!-- Divider -->
    <div class="mx-5 my-3 border-b border-slate-100 sm:mx-6"></div>
    <!-- Content -->
    <div class="px-5 pb-5 sm:px-6 sm:pb-6">
        @if (loading) {
        <div class="space-y-5">
            <!-- Address line skeleton -->
            <div class="space-y-2">
                <div class="h-3 w-24 animate-pulse rounded bg-slate-200"></div>
                <div class="h-4 w-48 animate-pulse rounded bg-slate-200"></div>
            </div>
            <!-- Address details skeleton -->
            <div class="grid grid-cols-2 gap-x-6 gap-y-5 md:grid-cols-4">
                @for (item of [1, 2, 3, 4]; track item) {
                <div class="space-y-2">
                    <div class="h-3 w-16 animate-pulse rounded bg-slate-200"></div>
                    <div class="h-4 w-20 animate-pulse rounded bg-slate-200"></div>
                </div>
                }
            </div>
        </div>
        } @else {
        <div class="space-y-5">
            <!-- Address -->
            <div class="space-y-1">
                <p class="text-xs font-medium uppercase
                   tracking-wide text-slate-400">
                    Address Line
                </p>

                <p class="text-sm font-medium text-slate-900">
                    {{ patientDetails?.Address || patientDetails?.address || '-' }}
                </p>
            </div>

            <div class="grid grid-cols-2 gap-x-6 gap-y-5 md:grid-cols-4">
                @for (item of addressDetails; track item.label) {

                <div class="min-w-0 space-y-1">

                    <p class="text-xs font-medium uppercase
                       tracking-wide text-slate-400">
                        {{ item.label }}
                    </p>

                    <p class="truncate text-sm font-medium
                       text-slate-900">
                        {{ item.value || '-' }}
                    </p>

                </div>

                }
            </div>

        </div>

        }

    </div>
</div>

<app-edit-address-dialog [open]="isEditDialogOpen" [details]="patientDetails" (openChange)="isEditDialogOpen = $event"
    (refetch)="handleRefetch()" />
